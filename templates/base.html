<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wathere | Public Water & Toilet Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="{{ url_for('index') }}">Wathere</a>
    <nav>
      <a href="{{ url_for('index') }}">Find facilities</a>
      <a href="{{ url_for('add_facility') }}">Add facility</a>
    </nav>
  </div>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer><div class="container">Wathere · Prototype for public facility discovery</div></footer>
</body>
</html>
